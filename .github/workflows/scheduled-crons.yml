name: Scheduled Crons

on:
  schedule:
    # 03:00 UTC (07:00 AM UAE) -> Daily summary, Visit closures digest, Weekly summary (Mondays)
    - cron: '0 3 * * *'
    # 05:00 UTC (09:00 AM UAE) -> Rotate Daily QR Code
    - cron: '0 5 * * *'
    # 05:30 UTC (09:30 AM UAE) -> Check Daily QR Delivery Health & Alert Admin
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Cron Job to execute'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - rotate_qr
          - check_delivery
          - daily_summary
          - weekly_summary
          - visit_closures

jobs:
  execute-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Determine Actions to Run
        id: plan
        run: |
          EVENT_NAME="${{ github.event_name }}"
          CRON_SCHEDULE="${{ github.event.schedule }}"
          INPUT_JOB="${{ github.event.inputs.job }}"
          
          echo "Event: $EVENT_NAME, Schedule: $CRON_SCHEDULE, Input: $INPUT_JOB"
          
          RUN_SUMMARY=false
          RUN_ROTATE=false
          RUN_CHECK=false
          
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_JOB" = "all" ]; then
              RUN_SUMMARY=true
              RUN_ROTATE=true
              RUN_CHECK=true
            elif [ "$INPUT_JOB" = "rotate_qr" ]; then
              RUN_ROTATE=true
            elif [ "$INPUT_JOB" = "check_delivery" ]; then
              RUN_CHECK=true
            elif [ "$INPUT_JOB" = "daily_summary" ] || [ "$INPUT_JOB" = "weekly_summary" ] || [ "$INPUT_JOB" = "visit_closures" ]; then
              RUN_SUMMARY=true
            fi
          elif [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$CRON_SCHEDULE" = "0 3 * * *" ]; then
              RUN_SUMMARY=true
            elif [ "$CRON_SCHEDULE" = "0 5 * * *" ]; then
              RUN_ROTATE=true
            elif [ "$CRON_SCHEDULE" = "30 5 * * *" ]; then
              RUN_CHECK=true
            else
              RUN_SUMMARY=true
              RUN_ROTATE=true
              RUN_CHECK=true
            fi
          fi
          
          echo "run_summary=$RUN_SUMMARY" >> $GITHUB_OUTPUT
          echo "run_rotate=$RUN_ROTATE" >> $GITHUB_OUTPUT
          echo "run_check=$RUN_CHECK" >> $GITHUB_OUTPUT

      - name: Execute Daily Summary & Closures Digest
        if: steps.plan.outputs.run_summary == 'true'
        run: |
          echo "Triggering Daily Summary..."
          curl -s -S -X GET "https://muhimmak.misalm.com/api/v1/cron/daily-summary" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -o /dev/null -w "daily-summary HTTP response: %{http_code}\n"
          
          echo "Triggering Visit Closures Digest..."
          curl -s -S -X GET "https://muhimmak.misalm.com/api/v1/cron/visit-closures-digest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -o /dev/null -w "visit-closures-digest HTTP response: %{http_code}\n"
          
          # Check if today is Monday (1) for Weekly Summary
          DAY_OF_WEEK=$(date -u +%u)
          if [ "$DAY_OF_WEEK" -eq 1 ] || [ "${{ github.event.inputs.job }}" = "weekly_summary" ] || [ "${{ github.event.inputs.job }}" = "all" ]; then
            echo "Triggering Weekly Summary..."
            curl -s -S -X GET "https://muhimmak.misalm.com/api/v1/cron/weekly-summary" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -o /dev/null -w "weekly-summary HTTP response: %{http_code}\n"
          fi

      - name: Rotate Daily QR Code
        if: steps.plan.outputs.run_rotate == 'true'
        run: |
          echo "Triggering Daily QR Code Rotation..."
          RESPONSE=$(curl -s -S -X GET "https://muhimmak.misalm.com/api/v1/cron/rotate-qr-code" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "Response: $RESPONSE"

      - name: Check Daily QR Delivery Health
        if: steps.plan.outputs.run_check == 'true'
        run: |
          echo "Triggering Daily QR Delivery Health Check..."
          RESPONSE=$(curl -s -S -X GET "https://muhimmak.misalm.com/api/v1/cron/check-daily-qr-delivery" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "Response: $RESPONSE"
